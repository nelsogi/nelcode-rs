[package]
name = "nel-desktop"
version = "1.0.1"
edition = "2024"

[dependencies]
nel-engine = { path = "../nel-engine" }
candle-core = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zip = "9.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Le pack GPU : les mêmes versions que tauri-plugin-updater (reqwest, rustls avec ring), rien de plus à compiler.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
getrandom = "0.3"
# Les clés (fournisseurs, MCP, Claude Agent) : Gestionnaire d'identification de Windows, trousseau macOS, Secret Service.
keyring = "4.2"
keyring-core = "1"
tokio = { version = "1", features = ["time", "macros", "sync", "rt"] }
# Les images des messages : décodage (PNG, JPEG, WebP, GIF), redimensionnement, réencodage sans métadonnées.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.23"
# Les explorateurs du mode Agent, lancés ensemble (join_all).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Linux, macOS : groupes de processus, espace disque, heure locale.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# GPU NVIDIA : voir nel-engine/src/gpu.rs et build.rs (DLL CUDA chargées en différé).
cuda = ["nel-engine/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Les tests des images : un PNG avec des textes (tEXt) à retirer.
png = "0.18"
