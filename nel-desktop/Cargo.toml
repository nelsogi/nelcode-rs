[package]
name = "nel-desktop"
version = "0.4.0"
edition = "2024"

[dependencies]
nel-engine = { path = "../nel-engine" }
candle-core = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zip = "9.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Le pack GPU : les mêmes versions que tauri-plugin-updater (reqwest, rustls avec ring), rien de plus à compiler.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[features]
# GPU NVIDIA : voir nel-engine/src/gpu.rs et build.rs (DLL CUDA chargées en différé).
cuda = ["nel-engine/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
