[package]
name = "nel-desktop"
version = "0.3.0"
edition = "2024"

[dependencies]
nel-engine = { path = "../nel-engine" }
candle-core = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zip = "9.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
