<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nel Code</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo"><span data-icon="asterisk"></span></span> Nel Code</div>
    <button id="new-chat" class="new-chat" data-i18n-title="html.newChat.title">
      <span><span data-icon="plus"></span> <span data-i18n="html.newChat"></span></span><kbd>Ctrl N</kbd>
    </button>
    <button id="claude-chat" class="new-chat claude" data-i18n-title="html.claudeChat.title">
      <span><span data-icon="bot"></span> Claude Agent</span>
    </button>
    <button id="project-btn" class="project-btn" aria-haspopup="menu"></button>
    <input id="search" class="search" type="search" data-i18n-placeholder="html.search" spellcheck="false">
    <div class="section-title" data-i18n="html.conversations"></div>
    <ul id="sessions" class="list sessions"></ul>
    <div class="section-title models-title">
      <span data-i18n="html.models"></span>
      <span class="title-btns">
        <button id="catalog-btn" class="icon-btn" data-i18n-title="html.catalog.title" data-i18n-aria-label="html.catalog.label"><span data-icon="download"></span></button>
        <button id="import-btn" class="icon-btn" data-i18n-title="html.import.title" data-i18n-aria-label="html.import.label"><span data-icon="plus"></span></button>
      </span>
    </div>
    <ul id="models" class="list models"></ul>
    <div class="sidebar-foot">
      <button id="settings-btn" class="ghost" data-i18n-title="html.settings.title"><span data-icon="settings"></span> <span data-i18n="html.settings"></span></button>
      <button id="usage-btn" class="ghost" data-i18n-title="html.usage.title" data-i18n-aria-label="html.usage.label"><span data-icon="chart-column"></span></button>
      <button id="arena-btn" class="ghost" data-i18n-title="html.arena.title" data-i18n-aria-label="html.arena.label"><span data-icon="trophy"></span></button>
      <button id="palette-btn" class="ghost" data-i18n-title="html.palette.title"><kbd>Ctrl K</kbd></button>
    </div>
  </aside>

  <section id="main">
    <header id="topbar">
      <div id="title" class="title" data-i18n-title="html.title.title"></div>
      <div class="chips">
        <span id="claude-chip" class="chip claude" hidden></span>
        <button id="usage-chip" class="chip usage" hidden></button>
        <span id="compare-chip" class="chip" hidden data-i18n-title="html.compare.title"></span>
        <button id="nelcode-chip" class="chip" hidden></button>
        <button id="mcp-chip" class="chip" hidden></button>
        <button id="agent-btn" class="chip" data-i18n-title="html.agent.title"><span data-icon="bot"></span><span data-i18n="html.agent"></span></button>
        <button id="transp-btn" class="chip" data-i18n-title="html.transparency.title"><span data-icon="eye"></span><span data-i18n="html.transparency"></span></button>
        <button id="files-btn" class="chip icon-only" data-i18n-title="html.files.title" data-i18n-aria-label="html.files.label"><span data-icon="folder-tree"></span></button>
        <button id="folder-chip" class="chip" data-i18n-title="html.folder.title"><span data-icon="folder"></span><span id="folder-name"></span></button>
        <button id="folder-open" class="chip icon-only" data-i18n-aria-label="html.folderOpen.label"><span data-icon="external-link"></span></button>
      </div>
    </header>

    <div id="update" class="update" hidden></div>

    <div id="scroller">
      <div id="messages"></div>
      <div id="empty" class="empty">
        <div class="empty-logo"><span data-icon="asterisk"></span></div>
        <h1 data-i18n="html.welcome"></h1>
        <p id="empty-hint"><span data-i18n="html.emptyHint.start"></span> <kbd>/</kbd> <span data-i18n="html.emptyHint.commands"></span> <kbd>Ctrl K</kbd> <span data-i18n="html.emptyHint.palette"></span></p>
      </div>
    </div>

    <div id="composer">
      <div id="suggest" class="suggest" hidden></div>
      <div id="attachments" class="attachments" hidden data-i18n-aria-label="html.attachments.label"></div>
      <div class="input-box">
        <span class="prompt-char"><span data-icon="chevron-right"></span></span>
        <textarea id="input" rows="1" data-i18n-placeholder="html.input" spellcheck="false"></textarea>
        <button id="image-btn" class="attach" data-i18n-title="html.image.title" data-i18n-aria-label="html.image.title"><span data-icon="image"></span></button>
        <button id="send" class="send" data-i18n-title="html.send.title" data-i18n-aria-label="html.send.label"><span data-icon="arrow-up"></span></button>
      </div>
      <div id="statusbar">
        <div id="context" class="context" role="button" tabindex="0" data-i18n-title="html.context.title">
          <div class="bar"><div id="context-fill"></div></div>
          <span id="context-text" data-i18n="conversation.tokens"></span>
        </div>
        <span id="status" class="status"></span>
      </div>
    </div>
  </section>

  <aside id="plan" class="plan" hidden></aside>
  <aside id="files" class="files" hidden data-i18n-aria-label="html.files.panel"></aside>
</div>

<div id="drop" class="drop" hidden><div class="drop-box"><div class="drop-icon"><span data-icon="download"></span></div><span data-i18n="html.drop"></span></div></div>
<div id="settings" class="settings-page" role="dialog" aria-modal="true" data-i18n-aria-label="html.settings" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<div id="menu" class="menu" hidden></div>
<div id="toasts" class="toasts"></div>
<div id="tip" class="tip" hidden></div>

<script src="icons.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
