[package]
name = "nel-engine"
version = "0.4.0"
edition = "2024"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = "9.5.1"
libloading = { version = "0.9", optional = true }

[features]
# CUDA (Candle). Les DLL CUDA ne sont jamais liées au démarrage : voir gpu.rs et nel-desktop/build.rs.
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:libloading"]
