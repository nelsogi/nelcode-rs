# Un tag v* (par exemple v0.1.0) : tests et paquets pour Windows, Linux et macOS, release brouillon sur GitHub.
# La release reste un brouillon : rien n'est publié tant qu'on ne clique pas sur « Publish release ».
# latest.json (mises à jour automatiques des trois systèmes) est joint à la release : les installations le voient une
# fois la release publiée.
# - Windows : tests (cargo et interface), installateur NSIS compilé avec la feature cuda (GPU NVIDIA avec le pack GPU),
#   sans aucune bibliothèque CUDA dedans.
# - Linux (expérimental) : ubuntu-22.04 pour une glibc assez ancienne (les paquets marchent sur les distributions plus
#   récentes) ; cargo test, AppImage et .deb, puis un test de démarrage de l'AppImage dans une fenêtre virtuelle (xvfb).
# - macOS (expérimental) : cargo test, binaire universel (Intel et Apple Silicon), .app et .dmg non signés.
# Les tests de l'interface (e2e, pilotés par le port de débogage de WebView2) ne tournent que sous Windows.
# Lancé à la main (workflow_dispatch) : mêmes compilations et tests, paquets en artefacts du workflow, sans release ni
# latest.json. Dans les deux cas, updater-test vérifie scripts/updater-json.sh avec de faux fichiers.
name: Release

on:
  push:
    tags: ["v*"]
  # Lancement à la main (onglet Actions → Release → Run workflow) : les trois systèmes sont compilés et testés, les
  # paquets gardés comme artefacts du workflow ; ni release, ni latest.json.
  workflow_dispatch:

permissions:
  contents: write # créer la release brouillon et y joindre les paquets

jobs:
  # La release brouillon, créée une fois : les trois systèmes y joignent leurs paquets.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Le tag correspond à la version de nel-desktop/Cargo.toml
        run: |
          version=$(grep -m1 '^version' nel-desktop/Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de nel-desktop/Cargo.toml"
            exit 1
          fi

      # La section de CHANGELOG.md pour cette version, en tête de la release (et dans latest.json : le bandeau
      # « Nel Code X.Y.Z est disponible » l'affiche, jusqu'au « --- »).
      - name: Release brouillon
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          {
            cat notes.md
            echo
            echo '---'
            echo
            echo "Nel Code pour Windows, Linux (expérimental) et macOS (expérimental). Les changements sont dans [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md), l'installation sur chaque système dans le [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#installation)."
            echo
            echo "- **Windows** : \`*_x64-setup.exe\`. L'installateur n'est pas signé : Windows SmartScreen peut afficher « Windows a protégé votre ordinateur » → « Informations complémentaires » → « Exécuter quand même »."
            echo "- **Linux** : \`*.AppImage\` (se met à jour tout seul) ou \`*.deb\` (Debian, Ubuntu ; mises à jour à la main)."
            echo "- **macOS** : \`*.dmg\` (Intel et Apple Silicon). L'appli n'est pas signée : au premier lancement, clic droit sur Nel Code → Ouvrir, ou Réglages Système → Confidentialité et sécurité → « Ouvrir quand même »."
            echo
            echo "Un modèle à importer (glisser-déposer le \`.nelmodel\` dans la fenêtre) : voir la release [models](https://github.com/$GITHUB_REPOSITORY/releases/tag/models) et sa [carte](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/MODEL-CARD.md)."
          } > body.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Nel Code $GITHUB_REF_NAME" --notes-file body.md
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  windows:
    needs: release
    # Lancement à la main : sans la release (sautée), mais jamais après une release ratée.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Les tests comparent le moteur aux sorties de référence du modèle de test, qui n'est pas dans le dépôt
      # (222 Mo) : il est pris dans la release « models ».
      - name: Modèle de test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models --pattern "minichat-v3b.nelmodel" --dir test-models

      # Les tests GGUF (moteur et interface) : le petit Qwen2.5-Coder du catalogue, et son tokenizer.json officiel.
      - name: Modèle GGUF de test
        shell: bash
        run: |
          curl -fsSL -o test-models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/ebb2015119c907b064c512bf053e945850b5875f/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          curl -fsSL -o test-models/qwen-tokenizer.json https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct/resolve/ea3f2471cf1b1f0db85067f1ef93848e38e88c25/tokenizer.json
          echo "1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32  test-models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf" | sha256sum -c

      - name: Tests
        run: cargo test --workspace

      # L'application debug pilotée par le port de débogage de WebView2, avec un dossier de données temporaire.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Les tests GPU (e2e/gpu.test.mjs) sont ignorés ici : pas de carte NVIDIA ni de pack.
      - name: Tests de l'interface
        run: |
          cargo build -p nel-desktop
          node --test --test-concurrency=1 --test-reporter=spec "e2e/*.test.mjs"

      # La feature cuda : nvcc compile les noyaux de Candle (cl.exe de MSVC dans le PATH), et l'exécutable est lié
      # aux bibliothèques d'import CUDA. Les DLL elles-mêmes ne sont pas dans l'installateur (pack GPU à part).
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'

      # L'image a Visual Studio 2026 (MSVC 14.5x), que nvcc 12.9 refuse : on y ajoute MSVC v143 (14.44), et c'est
      # lui qui est mis dans le PATH (cl.exe pour nvcc, et le reste de la compilation).
      - name: MSVC v143 pour nvcc
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.44.*")) {
            $p = Start-Process "$installer\setup.exe" -Wait -PassThru -ArgumentList 'modify', '--installPath', "`"$vs`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64', '--quiet', '--norestart'
            if ($p.ExitCode -notin 0, 3010) { throw "installation de MSVC v143 : code $($p.ExitCode)" }
          }
          Get-ChildItem "$vs\VC\Tools\MSVC" -Name

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"

      - name: Installateur
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de GPU sur le runner : les noyaux sont compilés pour Turing (GTX 16xx, RTX 20xx) et plus récent.
          CUDA_COMPUTE_CAP: "75"
          # Signature des mises à jour (.sig). La clé privée n'est que dans les secrets du dépôt.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: nel-desktop
          args: --features cuda
          releaseId: ${{ needs.release.outputs.id }}
          uploadUpdaterJson: false

      # Sans ce contrôle, une DLL CUDA importée normalement empêcherait Nel Code de démarrer sur un PC sans GPU :
      # elles doivent toutes être en chargement différé (nel-desktop/build.rs). Et l'installateur reste petit.
      - name: Aucune DLL CUDA au démarrage, aucune dans l'installateur
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release -Filter *.exe | Where-Object { $_.Name -in 'nel-desktop.exe', 'Nel Code.exe' } | Select-Object -First 1
          $deps = (dumpbin /dependents $exe.FullName) -join "`n"
          $normal = ($deps -split 'delay load dependencies')[0]
          if ($normal -match '(?im)^\s+(nvcuda|cudart|cublas|curand|nvrtc)\S*\.dll') { throw "$($Matches[0].Trim()) est importée sans chargement différé" }
          if ($deps -notmatch '(?i)cublas64_12\.dll') { throw "l'exécutable n'est pas compilé avec la feature cuda" }
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          "{0} : {1:N1} Mo" -f $setup.Name, ($setup.Length / 1MB)
          if ($setup.Length -gt 30MB) { throw "installateur de $([math]::Round($setup.Length / 1MB)) Mo : une bibliothèque CUDA y est-elle entrée ?" }

      # Lancement à la main : les paquets restent des artefacts du workflow (14 jours).
      - name: Paquets (artefact)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nelcode-windows
          path: target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: release
    # Lancement à la main : sans la release (sautée), mais jamais après une release ratée.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    # La plus ancienne image : les paquets demandent la glibc 2.35 au plus (Ubuntu 22.04, Debian 12 et plus récents).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # WebKitGTK et GTK (Tauri), xvfb (test de démarrage), gnome-keyring et dbus (le trousseau des tests : Secret
      # Service).
      - name: Bibliothèques du système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file xvfb gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Modèles de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models --pattern "minichat-v3b.nelmodel" --dir test-models
          curl -fsSL -o test-models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/ebb2015119c907b064c512bf053e945850b5875f/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          curl -fsSL -o test-models/qwen-tokenizer.json https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct/resolve/ea3f2471cf1b1f0db85067f1ef93848e38e88c25/tokenizer.json
          echo "1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32  test-models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf" | sha256sum -c

      # Le trousseau des tests : une session D-Bus avec GNOME Keyring déverrouillé (mot de passe jetable).
      - name: Tests
        run: dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --workspace'

      - name: AppImage et .deb
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: nel-desktop
          releaseId: ${{ needs.release.outputs.id }}
          uploadUpdaterJson: false

      - name: Test de démarrage (xvfb)
        run: bash scripts/linux-startup-test.sh "$(ls target/release/bundle/appimage/*.AppImage | head -n1)"

      - name: Le .deb s'installe
        run: |
          deb=$(ls target/release/bundle/deb/*.deb | head -n1)
          sudo apt-get install -y "./$deb"
          dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep /usr/bin/

      - name: Paquets (artefact)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nelcode-linux
          path: |
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: release
    # Lancement à la main : sans la release (sautée), mais jamais après une release ratée.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Modèles de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models --pattern "minichat-v3b.nelmodel" --dir test-models
          curl -fsSL -o test-models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/ebb2015119c907b064c512bf053e945850b5875f/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          curl -fsSL -o test-models/qwen-tokenizer.json https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct/resolve/ea3f2471cf1b1f0db85067f1ef93848e38e88c25/tokenizer.json
          echo "1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32  test-models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf" | shasum -a 256 -c

      - name: Tests
        run: cargo test --workspace

      # Pas de certificat Apple : l'appli n'est ni signée ni notarisée (voir le README pour l'ouvrir quand même).
      - name: Binaire universel, .app et .dmg
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: nel-desktop
          args: --target universal-apple-darwin
          releaseId: ${{ needs.release.outputs.id }}
          uploadUpdaterJson: false

      - name: Paquets (artefact)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nelcode-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          retention-days: 14

  # scripts/updater-json.sh avec de faux artefacts (UPDATER_DIR) : le JSON produit est affiché et vérifié, et un
  # artefact manquant doit faire échouer le script. Rien n'est lu ni écrit sur GitHub.
  updater-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: latest.json avec de faux fichiers
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          dir=$(mktemp -d)
          for f in "Nel.Code_0.9.0_x64-setup.exe" "Nel.Code_0.9.0_amd64.AppImage" "Nel.Code_universal.app.tar.gz"; do
            echo "faux paquet" > "$dir/$f"
            echo "signature-de-$f" > "$dir/$f.sig"
          done
          echo "pas signé" > "$dir/Nel.Code_0.9.0_amd64.deb"
          printf '### Ajouté\n\n- Une nouveauté.\n' > notes.md
          UPDATER_DIR="$dir" bash scripts/updater-json.sh v0.9.0 notes.md > latest.json
          echo "--- latest.json produit :"
          cat latest.json
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v0.9.0"
          jq -e --arg base "$base" '
            .version == "0.9.0" and (.notes | startswith("### Ajouté"))
            and .platforms["windows-x86_64"].url == "\($base)/Nel.Code_0.9.0_x64-setup.exe"
            and .platforms["windows-x86_64-nsis"].signature == "signature-de-Nel.Code_0.9.0_x64-setup.exe"
            and .platforms["linux-x86_64"].url == "\($base)/Nel.Code_0.9.0_amd64.AppImage"
            and .platforms["linux-x86_64-appimage"].signature == "signature-de-Nel.Code_0.9.0_amd64.AppImage"
            and .platforms["darwin-aarch64"].url == "\($base)/Nel.Code_universal.app.tar.gz"
            and .platforms["darwin-x86_64"] == .platforms["darwin-aarch64"]
            and (.platforms | keys | length) == 8
            and ([.platforms[].url] | all(endswith(".deb") | not))' latest.json
          # Sans paquet macOS : erreur, pas de latest.json incomplet.
          rm "$dir"/Nel.Code_universal.app.tar.gz*
          if UPDATER_DIR="$dir" bash scripts/updater-json.sh v0.9.0 notes.md > incomplet.json 2> erreur.txt; then
            echo "::error::latest.json produit sans le paquet macOS"; exit 1
          fi
          cat erreur.txt
          grep -q "macOS" erreur.txt

  # latest.json, une fois les trois systèmes joints (un seul fichier pour tous : pas d'écriture concurrente).
  updater:
    if: github.event_name == 'push'
    needs: [release, windows, linux, macos, updater-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          bash scripts/updater-json.sh "$GITHUB_REF_NAME" notes.md > latest.json
          jq -e '.platforms | has("windows-x86_64") and has("linux-x86_64") and has("darwin-aarch64")' latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
